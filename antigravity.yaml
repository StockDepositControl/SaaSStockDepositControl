# Reglas globales de sincronización y dependencias entre capas
orchestration:
  strict_boundaries: true # Evita que un agente escriba fuera de su target_dir
  shared_context:
    - "docs/ARCHITECTURE.md" # Contrato global de la API y modelo de datos relacional
    - "docs/API_DOCUMENTATION.md"
    - "docs/Plan.md"