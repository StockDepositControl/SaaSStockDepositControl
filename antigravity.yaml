version: "2026.1"
project:
  name: "app-stock-deposit-control"
  type: "monorepo"
  allowed_directories: ["backend/", "frontend-mobile/", "frontend-web/", "docker/", "scripts/", "docs/"]

mcpServers:
  codebase-memory:
    command: "npx"
    args: ["-y", "@modelcontextprotocol/server-memory"]
    env:
      REPOSITORY_PATH: "./backend"

# Declaración y registro de agentes del ecosistema
agents:
  - id: "dba-agent"
    name: "DBA Specialist"
    config_file: ".agents/agents/dba/agent.md"
    target_dir: "backend/"
    tools:
      - "view_file"
      - "grep_search"
      - "write_to_file"
      - "replace_file_content"
      - "multi_replace_file_content"
      - "run_command"
      - "ask_question"
      - "index_repository"
      - "search_graph"
      - "query_graph"
      - "trace_path"
      - "get_code_snippet"
      - "get_architecture"
      - "search_code"
      - "index_status"
      - "detect_changes"
    skills:
      - id: "codebase-memory"
        path: "//.agents/skills/codebase-memory"
      - id: "database-migrations-sql-migrations"
        path: "//.agents/skills/database-migrations-sql"
      - id: "saas-multi-tenant"
        path: "//.agents/skills/saas-multi-tenant"
      - id: "architecture-patterns"
        path: "//.agents/skills/architecture-patterns"
      - id: "pytest-skill"
        path: "//.agents/skills/pytest-skill"

  - id: "core-backend-agent"
    name: "Senior Backend Engineer"
    config_file: ".agents/agents/core_backend/agent.md"
    target_dir: "backend/"
    # Tools and Skills.
    tools: 
      - "view_file"
      - "grep_search"
      - "write_to_file"
      - "replace_file_content"
      - "multi_replace_file_content"
      - "run_command"
      - "ask_question"
      - "index_repository"
      - "search_graph"
      - "query_graph"
      - "trace_path"
      - "get_code_snippet"
      - "get_architecture"
      - "search_code"
      - "index_status"
      - "detect_changes"
    skills:
      - id: "codebase-memory"
        path: "//.agents/skills/codebase-memory"
      - id: "architecture-patterns"
        path: "//.agents/skills/architecture-patterns"
      - id: "ddd-tactical-patterns"
        path: "//.agents/skills/ddd-tactical-patterns"
      - id: "fastapi-pro"
        path: "//.agents/skills/fastapi-pro"
