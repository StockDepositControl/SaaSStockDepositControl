version: "2026.1"
project:
  name: "app-stock-deposit-control"
  type: "monorepo"
  allowed_directories: ["backend/", "frontend-mobile/", "frontend-web/"]

# Declaración y registro de agentes del ecosistema
agents:
  - id: "dba-agent"
    name: "DBA Specialist"
    config_file: ".antigravity/agents/dba.agent"
    target_dir: "backend/migrations/"

  - id: "core-backend-agent"
    name: "Jules (Backend Core)"
    config_file: ".antigravity/agents/core_backend.agent"
    target_dir: "backend/app/"

  - id: "mobile-dev-agent"
    name: "Mobile UI & Sync Specialist"
    config_file: ".antigravity/agents/mobile_dev.agent"
    target_dir: "frontend-mobile/"

  - id: "web-analytics-agent"
    name: "Web Analytics Dashboard Specialist"
    config_file: ".antigravity/agents/web_analytics.agent"
    target_dir: "frontend-web/"

# Reglas globales de sincronización y dependencias entre capas
orchestration:
  strict_boundaries: true # Evita que un agente escriba fuera de su target_dir
  shared_context:
    - "docs/architecture.md" # Contrato global de la API y modelo de datos relacional
