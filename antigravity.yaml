version: "2026.1"
project:
  name: "app-stock-deposit-control"
  type: "monorepo"
  allowed_directories: ["backend/", "frontend-mobile/", "frontend-web/"]

mcpServers:
  codebase-memory:
    command: "npx"
    args: ["-y", "@modelcontextprotocol/server-memory"]
    env:
      REPOSITORY_PATH: "./backend"

# Declaración y registro de agentes del ecosistema
agents:
  - id: "dba-agent"
    name: "DBA Specialist"
    config_file: ".agents/agents/dba/agent.md"
    target_dir: "backend/"
    tools:
      - "view_file"
      - "grep_search"
      - "list_dir"
      - "find_by_name"
      - "write_to_file"
      - "replace_file_content"
      - "multi_replace_file_content"
      - "run_command"
      - "call_mcp_tool"
      - "ask_question"
    skills:
      - id: "database-migrations-sql-migrations"
        path: "//.agents/skills/database-migrations-sql"
      - id: "saas-multi-tenant"
        path: "//.agents/skills/saas-multi-tenant"
      - id: "architecture-patterns"
        path: "//.agents/skills/architecture-patterns"
      - id: "pytest-skill"
        path: "//.agents/skills/pytest-skill"

  - id: "core-backend-agent"
    name: "Senior Backend Engineer"
    config_file: ".agents/agents/core_backend/agent.md"
    target_dir: "backend/"
    # Tools and Skills.
    tools: 
      - "view_file"
      - "grep_search"
      - "list_dir"
      - "find_by_name"
      - "write_to_file"
      - "replace_file_content"
      - "multi_replace_file_content"
      - "run_command"
      - "call_mcp_tool"
      - "ask_question"
    skills:
      - id: "architecture-patterns"
        path: "//.agents/skills/architecture-patterns"
      - id: "ddd-tactical-patterns"
        path: "//.agents/skills/ddd-tactical-patterns"
      - id: "fastapi-pro"
        path: "//.agents/skills/fastapi-pro"
      - id: "auth-implementation-patterns"
        path: "//.agents/skills/auth-implementation-patterns"
      - id: "pytest-skill"
        path: "//.agents/skills/pytest-skill"

#  - id: "mobile-dev-agent"
#    name: "Mobile UI & Sync Specialist"
#    config_file: ".agents/agents/mobile_dev/AGENTS.md"
#    target_dir: "frontend-mobile/"

#  - id: "web-analytics-agent"
#    name: "Web Analytics Dashboard Specialist"
#    config_file: ".agents/agents/web_analytics/AGENTS.md"
#    target_dir: "frontend-web/"

# Reglas globales de sincronización y dependencias entre capas
orchestration:
  strict_boundaries: true # Evita que un agente escriba fuera de su target_dir
  shared_context:
    - "docs/architecture.md" # Contrato global de la API y modelo de datos relacional
    - "docs/functional_specs.md" # Especificaciones funcionales de alto nivel