      - id: "pytest-skill"
        path: "//.agents/skills/pytest-skill"

  - id: "devops-deploy-agent"
    name: "DevOps & SRE Specialist"
    config_file: ".agents/agents/devops_deploy/agent.md"
    target_dir: "./"
    tools:
      - "view_file"
      - "grep_search"
      - "write_to_file"
      - "replace_file_content"
      - "multi_replace_file_content"
      - "run_command"
      - "ask_question"
      - "index_repository"
      - "search_graph"
      - "query_graph"
