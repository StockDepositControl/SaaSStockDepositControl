# Optional EAS preview build (spec portable-deployment-cicd §5.8, task T18).
# Never blocks backend/web CD: the build is skipped until EXPO_TOKEN and
# frontend-mobile/eas.json (with a `preview` profile) exist.
name: Mobile release

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eas-build:
    name: EAS Android preview build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend-mobile
    env:
      EAS_CLI_VERSION: 24.12.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check prerequisites
        id: gate
        # EXPO_TOKEN is scoped to the steps that need it, never to `npm ci` install scripts.
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::notice::EXPO_TOKEN is not set; skipping the EAS build."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ ! -f eas.json ]; then
            echo "::notice::frontend-mobile/eas.json is missing; skipping the EAS build."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-mobile/package-lock.json
      - if: steps.gate.outputs.enabled == 'true'
        run: npm ci
      - name: EAS build (queued, does not wait for completion)
        if: steps.gate.outputs.enabled == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes "eas-cli@${EAS_CLI_VERSION}" build --platform android --profile preview --non-interactive --no-wait
